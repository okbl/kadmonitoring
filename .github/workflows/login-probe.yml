# Проба: как устроен вход на kad.arbitr (вход не выполняется; в журнал —
# только устройство страниц и имена cookies).
name: login-probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/login-probe.yml'
      - 'tools/login-probe.mjs'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright-core install chromium
      - name: Вход на kad
        run: node tools/login-probe.mjs https://kad.arbitr.ru/Card/2aa24115-6d6f-4b9e-9c17-cd43a0bd8ef5
