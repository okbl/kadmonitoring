# Свой обработчик kad.arbitr: собрать Docker-образ, запустить его и
# проверить на настоящей карточке — страница программы подключается к нему
# и загружает спор без вкладки kad.arbitr. В журнал — только числа, стадия
# и сроки. Образ публикуется в GitHub Packages (ghcr.io).
name: handler

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/handler.yml'
      - 'Dockerfile'
      - 'handler.mjs'
      - 'server/**'
      - 'tools/handler-probe.mjs'

permissions:
  contents: read
  packages: write

jobs:
  build-and-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright-core install chromium
      - name: Собрать образ
        run: docker build -t kad-handler .
      - name: Запустить обработчик из образа
        run: |
          KEY=$(openssl rand -hex 16)
          echo "::add-mask::$KEY"
          echo "KAD_KEY=$KEY" >> "$GITHUB_ENV"
          docker run -d --name kad-handler -p 8787:8787 -e KAD_KEY="$KEY" -e KAD_ORIGINS=http://127.0.0.1:8099 kad-handler
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8787/ping && break; sleep 1; done
      - name: Сайт через обработчик на настоящей карточке
        env:
          KAD_HANDLER: http://127.0.0.1:8787
          SITE_PORT: '8099'
        run: node tools/handler-probe.mjs https://kad.arbitr.ru/Card/2aa24115-6d6f-4b9e-9c17-cd43a0bd8ef5 23.06.2026
      - name: Журнал обработчика
        if: always()
        run: docker logs kad-handler 2>&1 | sed -E 's/[0-9a-f]{8}-[0-9a-f-]{27}/<id>/g' | tail -n 30
      - name: Опубликовать образ
        if: success() && github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kad-handler
          docker tag kad-handler "$IMG:latest"
          docker push "$IMG:latest"
