# Проба на настоящей картотеке: расширение браузера по ссылке и дате
# загружает карточку, ставит спор на отслеживание и загружает тексты
# определений; сайт программы работает через расширение. В журнал попадают
# только сводные числа, стадия и путь загрузки — без имён и текстов.
name: kad-probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kad-probe.yml'
      - 'tools/ext-probe.mjs'
      - 'extension/**'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Chrome с раннера расширения из папки не загружает; Chromium — загружает.
      - run: npx playwright-core install chromium
      - name: Расширение на настоящей карточке
        env:
          KAD_SITE: https://okbl.github.io/kadmonitoring/
        run: node tools/ext-probe.mjs https://kad.arbitr.ru/Card/2aa24115-6d6f-4b9e-9c17-cd43a0bd8ef5 23.06.2026
