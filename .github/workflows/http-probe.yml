# Проба: можно ли получать карточку kad.arbitr без браузера — обычными
# HTTP-запросами, как маленький прокси-сервер; разрешает ли картотека
# чужим сайтам читать ответы (CORS, JSONP). В журнал — устройство ответов,
# да/нет и числа, без содержания карточки.
name: http-probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/http-probe.yml'
      - 'tools/http-probe.mjs'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm i --no-save jsdom
      - name: Карточка без браузера
        run: node tools/http-probe.mjs https://kad.arbitr.ru/Card/2aa24115-6d6f-4b9e-9c17-cd43a0bd8ef5
