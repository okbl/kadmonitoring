# Цены дешёвых VPS у российских хостингов (для размещения обработчика).
name: vps-prices

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vps-prices.yml'
      - 'tools/vps-prices.mjs'

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright-core install chromium
      - run: node tools/vps-prices.mjs
