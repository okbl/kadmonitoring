# Проба: возможен ли мост «сайт ↔ вкладка kad» через закладку — без
# расширения. В журнал — только заголовки безопасности kad, да/нет и числа.
name: bridge-probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bridge-probe.yml'
      - 'tools/bridge-feasibility.mjs'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright-core install chromium
      - name: Мост на настоящей карточке
        run: node tools/bridge-feasibility.mjs https://kad.arbitr.ru/Card/2aa24115-6d6f-4b9e-9c17-cd43a0bd8ef5 https://okbl.github.io/kadmonitoring/
