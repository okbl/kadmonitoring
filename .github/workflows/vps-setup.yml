# Проверка скрипта установки обработчика на чистой Ubuntu (сервер GitHub):
# скрипт ставит пакеты, собирает и запускает обработчик (без https — у
# сервера GitHub нет входящих соединений), затем сайт подключается к нему и
# загружает настоящую карточку. В журнал — только числа и стадия.
name: vps-setup

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vps-setup.yml'
      - 'tools/vps-setup.sh'

jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Скрипт установки (как на VPS)
        run: sudo env SKIP_TLS=1 BRANCH="${GITHUB_REF_NAME}" bash tools/vps-setup.sh
      - name: Повторный запуск — обновление с тем же ключом
        run: |
          before=$(sudo cat /etc/kad-handler.env)
          sudo env SKIP_TLS=1 BRANCH="${GITHUB_REF_NAME}" bash tools/vps-setup.sh > /dev/null
          [ "$before" = "$(sudo cat /etc/kad-handler.env)" ] && echo 'ключ сохранён'
          echo "KAD_KEY=$(sudo sed -n 's/^KAD_KEY=//p' /etc/kad-handler.env)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npx playwright-core install chromium
      - name: Сайт через установленный обработчик
        env:
          KAD_HANDLER: http://127.0.0.1:8787
          SITE_PORT: '8099'
        run: |
          # Обработчик разрешает только сайт программы — для пробы перезапускаем его с адресом пробной страницы.
          sudo docker rm -f kad-handler >/dev/null
          sudo docker run -d --name kad-handler -p 127.0.0.1:8787:8787 -e KAD_KEY="$KAD_KEY" -e KAD_ORIGINS=http://127.0.0.1:8099 kad-handler >/dev/null
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8787/ping >/dev/null && break; sleep 1; done
          node tools/handler-probe.mjs https://kad.arbitr.ru/Card/2aa24115-6d6f-4b9e-9c17-cd43a0bd8ef5 23.06.2026
      - name: Пакет caddy в репозиториях Ubuntu
        run: apt-cache policy caddy | head -3
